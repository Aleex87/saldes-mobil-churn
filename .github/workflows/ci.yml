name: CI

on: push

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - run: pytest

  train:
    name: Train model
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - run: python -m churn.model
      - name: Upload model and metrics
        uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error
  evaluate:
    name: Evaluate model
    needs: train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - name: Download model and metrics
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Write metrics to Summary
        run: |
          {
            echo '## Model metrics and provenance'
            echo '```json'
            cat outputs/matvarden.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check model quality
        run: python -m churn.evaluate