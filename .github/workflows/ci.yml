name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "**/*.csv"
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "**/*.csv"
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record incident metrics
        if: matrix.python-version == '3.11'
        run: python -m churn.model
      - run: pytest
  train:
    name: Train model
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - run: python -m churn.model

      - name: Upload model and metrics
        uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  evaluate:
    name: Evaluate model
    needs: train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Download model and metrics
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Write metrics to Summary
        run: |
          {
            echo '## Model metrics and provenance'
            echo '```json'
            cat outputs/matvarden.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check model quality
        run: python -m churn.evaluate

  ringlista:
    name: Generate call list
    needs: evaluate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Generate call list
        run: python -m churn.score

      - name: Upload call list
        uses: actions/upload-artifact@v7
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error
